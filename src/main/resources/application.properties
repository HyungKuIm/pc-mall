spring.application.name=pc-mall

# DataSource (MySQL)
# 접속 정보는 환경변수 DB_URL / DB_USERNAME / DB_PASSWORD 로 덮어쓸 수 있다.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/dbdemoboot?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:demoboot}
spring.datasource.password=${DB_PASSWORD:demo1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 이미지 업로드 크기 제한
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
